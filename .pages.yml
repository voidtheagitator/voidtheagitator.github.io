media:
  input: assets/images
  output: /assets/images
content:
  - name: publications
    label: Official Publications
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    fields:
      - name: title
        label: Publication title
        type: string
        required: true
      - name: body
        label: Text
        type: rich-text
        options:
          format: markdown
  - name: charter
    label: Founding Charter
    type: file
    path: charter/index.md
    format: yaml-frontmatter
    fields:
      - name: title
        type: string
      - name: body
        type: rich-text
        options:
          format: markdown
  - name: departments
    label: Departments
    type: file
    path: departments/index.md
    format: yaml-frontmatter
    fields:
      - name: title
        type: string
      - name: body
        type: rich-text
        options:
          format: markdown
  - name: membership
    label: Membership
    type: file
    path: membership/index.md
    format: yaml-frontmatter
    fields:
      - name: title
        type: string
      - name: body
        type: rich-text
        options:
          format: markdown
  - name: about
    label: About
    type: file
    path: about/index.md
    format: yaml-frontmatter
    fields:
      - name: title
        type: string
      - name: body
        type: rich-text
        options:
          format: markdown
